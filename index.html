<script>
(() => {
  const layer = document.querySelector('.cursor-light');
  const halo = layer.querySelector('b');
  const reduced = matchMedia('(prefers-reduced-motion: reduce)');
  const colors = ['#f34561','#ff973c','#e7c839','#51ca76','#27a8eb','#8958ed'];
  let last = null;
  let color = 0;
  function dot(x, y) {
    if (layer.childElementCount >= 20) layer.children[1].remove();
    const point = document.createElement('i');
    point.style.backgroundColor = colors[color++ % colors.length];
    point.style.left = (x - 2) + 'px';
    point.style.top = (y - 2) + 'px';
    layer.append(point);
    const fade = point.animate([
      {opacity:.60, transform:'scale(1)'},
      {opacity:0, transform:'translateY(-3px) scale(.45)'}
    ], {duration:650, easing:'ease-out'});
    fade.onfinish = () => point.remove();
  }
  function follow(event) {
    if (!event.isPrimary || reduced.matches) return;
    const x = event.clientX, y = event.clientY;
    halo.style.transform = 'translate(' + x + 'px,' + y + 'px)';
    halo.style.opacity = '.16';
    if (!last) { dot(x,y); last = {x,y}; return; }
    const dx = x - last.x, dy = y - last.y;
    const distance = Math.hypot(dx,dy);
    if (distance < 9) return;
    const steps = Math.min(5,Math.floor(distance / 9));
    for (let n = 1; n <= steps; n++) dot(last.x + dx*n/steps, last.y + dy*n/steps);
    last = {x,y};
  }
  function clear() { halo.style.opacity = '0'; last = null; }
  window.addEventListener('pointermove', follow, {passive:true});
  window.addEventListener('pointerdown', follow, {passive:true});
  window.addEventListener('pointerup', e => { if (e.pointerType !== 'mouse') clear(); });
  window.addEventListener('pointercancel', clear);
  document.documentElement.addEventListener('pointerleave', clear);
  window.addEventListener('blur', clear);
  reduced.addEventListener('change', clear);
})();
</script>
