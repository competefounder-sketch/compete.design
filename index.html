<script>
(() => {
  const layer = document.querySelector('.cursor-light');
  const halo = layer.querySelector('b');
  const reduced = matchMedia('(prefers-reduced-motion: reduce)');
  const colors = ['#f34561','#ff973c','#e7c839','#51ca76','#27a8eb','#8958ed'];
  let last = null;
  let color = 0;
  function dot(x, y) {
    if (layer.childElementCount >= 20) layer.children[1].remove();
    const point = document.createElement('i');
    point.style.backgroundColor = colors[color++ % colors.length];
    point.style.left = (x - 2) + 'px';
    point.style.top = (y - 2) + 'px';
    layer.append(point);
    const fade = point.animate([
      {opacity:.60, transform:'scale(1)'},
      {opacity:0, transform:'translateY(-3px) scale(.45)'}
    ], {duration:650, easing:'ease-out'});
    fade.onfinish = () => point.remove();
  }
  function follow(event) {
    if (!event.isPrimary || reduced.matches) return;
    const x = event.clientX, y = event.clientY;
    halo.style.transform = 'translate(' + x + 'px,' + y + 'px)';
    halo.style.opacity = '.16';
    if (!last) { dot(x,y); last = {x,y}; return; }
    const dx = x - last.x, dy = y - last.y;
    const distance = Math.hypot(dx,dy);
    if (distance < 9) return;
    const steps = Math.min(5,Math.floor(distance / 9));
    for (let n = 1; n <= steps; n++) dot(last.x + dx*n/steps, last.y + dy*n/steps);
    last = {x,y};
  }
  function clear() { halo.style.opacity = '0'; last = null; }
  window.addEventListener('pointermove', follow, {passive:true});
  window.addEventListener('pointerdown', follow, {passive:true});
  window.addEventListener('pointerup', e => { if (e.pointerType !== 'mouse') clear(); });
  window.addEventListener('pointercancel', clear);
  document.documentElement.addEventListener('pointerleave', clear);
  window.addEventListener('blur', clear);
  reduced.addEventListener('change', clear);
})();
</script>
<script>
(() => {
  const canvas = document.querySelector('.ambient-waves');
  const ctx = canvas.getContext('2d');
  if (!ctx) return;
  const motion = matchMedia('(prefers-reduced-motion: reduce)');
  let width, height, frame, previous, phase = 0;
  function paint() {
    ctx.clearRect(0, 0, width, height);
    const narrow = width < 650;
    const count = narrow ? 32 : Math.min(86, Math.ceil(width / 17));
    const radius = narrow ? 1.85 : 2.45;
    for (let band = 0; band < 2; band++) {
      for (let row = 0; row < 5; row++) {
        for (let i = -1; i <= count + 1; i++) {
          const flow = phase * .32 + row * .12;
          const u = (i + (flow - Math.floor(flow))) / count;
          const t = band ? 1 - u : u;
          const wave = 5.8 * u + phase * .63 + band * 2.6;
          const ripple = 9 * u - phase * .45 + row * .24;
          const spread = .011 + .007 * (1 + Math.sin(wave));
          const y = .17 + .058 * Math.sin(wave) + .025 * Math.sin(ripple) + (row - 2) * spread;
          const light = .5 + .5 * Math.cos(ripple + row * .4);
          ctx.fillStyle = 'hsla(' + ((325 + 300*u + phase*7 + band*75 + row*5) % 360) + ',78%,49%,' + (.31 + .49*light) + ')';
          ctx.beginPath();
          ctx.arc(t*width, (band ? 1-y : y)*height, radius*(.72+.55*light), 0, 2*Math.PI);
          ctx.fill();
        }
      }
    }
  }
  function tick(now) {
    if (previous !== undefined) phase += Math.min(.1, (now-previous)/1000);
    previous = now;
    paint();
    frame = requestAnimationFrame(tick);
  }
  function refresh() {
    cancelAnimationFrame(frame);
    previous = undefined;
    if (document.hidden) return;
    width = canvas.clientWidth;
    height = canvas.clientHeight;
    const scale = Math.min(2, window.devicePixelRatio || 1);
    canvas.width = Math.round(width * scale);
    canvas.height = Math.round(height * scale);
    ctx.setTransform(scale, 0, 0, scale, 0, 0);
    paint();
    if (!motion.matches) frame = requestAnimationFrame(tick);
  }
  window.addEventListener('resize', refresh);
  document.addEventListener('visibilitychange', refresh);
  motion.addEventListener('change', refresh);
  refresh();
})();
</script>
