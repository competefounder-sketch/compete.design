<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#e9ebe3">
<meta name="description" content="COMPETE">
<title>Login | COMPETE</title>
<link rel="stylesheet" href="compete.css">
<style>
.entry-logo,.entry-rule{display:none;pointer-events:none;position:fixed;z-index:1}
.entering .entry-logo,.entering .entry-rule{display:block}
.entry-rule{height:1px;background:#16181566;transform-origin:0 50%}
.entering .email-field{border-bottom-color:transparent}
.entering .entry-logo{overflow:visible}

.login .email-field{position:relative;height:50px;padding-inline:44px}
.email-field .field-mark{position:absolute;top:50%;transform:translateY(-50%);width:calc(20px + var(--join,0)*20px);height:auto;pointer-events:none;fill:currentColor;stroke:none}
.email-field .mark-left{left:calc(12px + var(--join,0)*(50% - 53px))}
.email-field .mark-right{right:calc(12px + var(--join,0)*(50% - 53px));opacity:0}
.send-step{position:absolute;right:0;top:0;width:44px;height:100%;display:grid;place-items:center;border:0;background:transparent;color:inherit;cursor:pointer;padding:0}
.send-step:focus-visible{outline:2px solid currentColor;outline-offset:-2px}
.login[data-preview] .mark-right,.login[data-step="password"] .mark-right,.login[data-step="done"] .mark-right{opacity:1}
.login[data-preview] .send-step svg,.login[data-step="password"] .send-step svg{opacity:0}
.login[data-step="done"] .email-field{border-color:transparent}
.login[data-step="done"] .email-hint{visibility:hidden}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap}
.login [hidden]{display:none}
@media(prefers-reduced-motion:no-preference){.mark-right,.send-step svg{transition:opacity 160ms ease-out}}
</style>
<script>
let loginOrigin;
try {
  const entry = JSON.parse(sessionStorage.getItem('compete-login-entry'));
  sessionStorage.removeItem('compete-login-entry');
  if (entry && Date.now()-entry.time < 15000 && entry.width > 0 &&
      !matchMedia('(prefers-reduced-motion: reduce)').matches && Element.prototype.animate) {
    loginOrigin = entry;
    document.documentElement.classList.add('entering');
  }
} catch {}
</script>
</head>
<body>
<div class="background" aria-hidden="true"><i class="cross tl" aria-hidden="true"></i><i class="cross tr" aria-hidden="true"></i><i class="cross bl" aria-hidden="true"></i><i class="cross br" aria-hidden="true"></i></div>
<canvas class="glow" aria-hidden="true"></canvas>
<main class="shell" aria-label="COMPETE">
<div class="landing">
<a class="page-link" href="./">Home</a>
<form class="login" data-step="email" novalidate aria-label="Accesso dimostrativo" autocomplete="off">
<div class="email-field">
<svg class="field-mark mark-left" viewBox="0 0 205 235" aria-hidden="true"><path d="M0 118 117 0h88L87 118l118 117h-88Z"/></svg>
<input id="demo-email" type="text" inputmode="email" enterkeyhint="next" autocapitalize="none" autocomplete="off" spellcheck="false" aria-labelledby="step-label">
<input id="demo-password" type="password" enterkeyhint="go" autocomplete="off" aria-labelledby="step-label" hidden disabled>
<svg class="field-mark mark-right" viewBox="0 0 205 235" aria-hidden="true"><defs><linearGradient class="animated-spectrum" id="field-spectrum" x1="0%" y1="100%" x2="100%" y2="0%">
<stop offset="0%" stop-color="#fc4449"/>
<stop offset="20%" stop-color="#ff9839"/>
<stop offset="37%" stop-color="#fce64d"/>
<stop offset="53%" stop-color="#67dc54"/>
<stop offset="70%" stop-color="#32c7ef"/>
<stop offset="84%" stop-color="#6358fa"/>
<stop offset="100%" stop-color="#b348ee"/>
</linearGradient></defs><path fill="url(#field-spectrum)" d="M0 0h88l117 118-117 117H0l118-117Z"/></svg>
<button class="send-step" type="submit" aria-label="Continua"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 12h15m-6-6 6 6-6 6"/></svg></button>
</div>
<p id="step-label" class="email-hint" lang="en">Email</p>
<span class="sr-only" role="status" aria-live="polite"></span>
</form>
</div>
</main>
<template id="entry-art"><svg class="logo entry-logo" viewBox="120 146 1361 280" aria-hidden="true">
<defs>
<linearGradient class="animated-spectrum" id="rainbow" x1="0%" y1="100%" x2="100%" y2="0%">
<stop offset="0%" stop-color="#fc4449"/>
<stop offset="20%" stop-color="#ff9839"/>
<stop offset="37%" stop-color="#fce64d"/>
<stop offset="53%" stop-color="#67dc54"/>
<stop offset="70%" stop-color="#32c7ef"/>
<stop offset="84%" stop-color="#6358fa"/>
<stop offset="100%" stop-color="#b348ee"/>
</linearGradient></defs>
<polygon id="left" points="120,264 237,146 325,146 207,264 325,381 237,381"/>
<image href="wordmark.png" x="329" y="146" width="1067" height="279"/>
<polygon id="rainbow-dot" fill="url(#rainbow)" points="1416,296 1481,296 1481,328 1481,360 1416,360 1416,328"/>
</svg></template>
<script>
if (loginOrigin) {
  const root = document.documentElement;
  const art = document.querySelector('#entry-art').content.firstElementChild.cloneNode(true);
  const rule = document.createElement('span');
  rule.className = 'entry-rule';
  rule.setAttribute('aria-hidden','true');
  Object.assign(art.style, {left:loginOrigin.x+'px', top:loginOrigin.y+'px', width:loginOrigin.width+'px'});
  document.body.append(art, rule);
  const animations = [];
  function finish() {
    root.classList.remove('entering');
    animations.forEach(animation => animation.cancel());
    art.remove();
    rule.remove();
    window.removeEventListener('pagehide', finish);
    window.removeEventListener('resize', finish);
  }
  function play(element, frames, duration, delay=0) {
    const animation = element.animate(frames, {duration, delay, fill:'both', easing:'cubic-bezier(.4,0,.2,1)'});
    animations.push(animation);
    return animation;
  }
  try {
    const field = document.querySelector('.email-field');
    const box = field.getBoundingClientRect();
    const icon = field.querySelector('svg').getBoundingClientRect();
    const dot = art.querySelector('#rainbow-dot').getBoundingClientRect();
    const chevron = art.querySelector('#left');
    const unitsPerPixel = 1361 / art.getBoundingClientRect().width;
    const word = art.querySelector('image');
    const mark = art.querySelector('#rainbow-dot');
    // Collapse the word onto the field chevron, then stretch the square into the input baseline.
    for (const piece of [chevron,word]) {
      const r = piece.getBoundingClientRect();
      const dx = (icon.x+icon.width/2-r.x-r.width/2)*unitsPerPixel;
      const dy = (icon.y+icon.height/2-r.y-r.height/2)*unitsPerPixel;
      piece.style.transformBox = 'fill-box';
      piece.style.transformOrigin = 'center';
      const scale = piece === chevron ? icon.width/r.width : .08;
      play(piece,[{transform:'none',opacity:1},{transform:'translate('+dx+'px,'+dy+'px) scale('+scale+')',opacity:0}],piece === chevron ? 640 : 490);
    }
    Object.assign(rule.style,{left:box.left+'px',top:(box.bottom-1)+'px',width:box.width+'px'});
    const dx = dot.left-box.left, dy = dot.top+dot.height/2-(box.bottom-.5);
    play(rule,[{transform:'translate('+dx+'px,'+dy+'px) scale('+dot.width/box.width+','+dot.height+')',opacity:0},
      {opacity:.9,offset:.28},{transform:'none',opacity:1}],720);
    play(mark,[{opacity:1},{opacity:0}],230);
    play(document.querySelector('.background'),[{clipPath:'inset(48% 44%)',opacity:0},{clipPath:'inset(0% 0%)',opacity:1}],740);
    for (const el of [field.querySelector('svg'),document.querySelector('.send-step'),document.querySelector('.email-hint'),document.querySelector('.page-link')]) {
      play(el,[{opacity:0},{opacity:1}],240,470);
    }
    window.addEventListener('pagehide',finish,{once:true});
    window.addEventListener('resize',finish,{once:true});
    Promise.all(animations.map(animation=>animation.finished)).then(finish,()=>{});
  } catch { finish(); }
}
</script>
<script src="login-demo.js"></script>
</body>
</html>
