<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#e9ebe3">
<meta name="description" content="COMPETE">
<title>Login | COMPETE</title>
<link rel="stylesheet" href="compete.css">
</head>
<body>
<div class="background" aria-hidden="true"><i class="cross tl" aria-hidden="true"></i><i class="cross tr" aria-hidden="true"></i><i class="cross bl" aria-hidden="true"></i><i class="cross br" aria-hidden="true"></i></div>
<canvas class="glow" aria-hidden="true"></canvas>
<main class="shell" aria-label="COMPETE">
<div class="landing">
<a class="page-link" href="./">Home</a>
<div class="stage">
<button type="button" class="replay" aria-label="Rivedi l’animazione del logo" disabled>
<svg class="logo" viewBox="0 75 1600 415" role="img" aria-label="Logo COMPETE">
<defs><clipPath id="reveal"><rect id="window" x="329" y="145" width="1067" height="282"/></clipPath>
<linearGradient id="rainbow" class="animated-spectrum" x1="0%" y1="100%" x2="100%" y2="0%">
<stop offset="0%" stop-color="#fc4449"/>
<stop offset="20%" stop-color="#ff9839"/>
<stop offset="37%" stop-color="#fce64d"/>
<stop offset="53%" stop-color="#67dc54"/>
<stop offset="70%" stop-color="#32c7ef"/>
<stop offset="84%" stop-color="#6358fa"/>
<stop offset="100%" stop-color="#b348ee"/>
</linearGradient></defs>
<polygon id="left" points="120,264 237,146 325,146 207,264 325,381 237,381"/>
<image href="wordmark.png" x="329" y="146" width="1067" height="279" clip-path="url(#reveal)"/>
<polygon id="right" points="1416,296 1481,296 1481,328 1481,360 1416,360 1416,328"/>
<polygon id="rainbow-dot" fill="url(#rainbow)" points="1416,296 1481,296 1481,328 1481,360 1416,360 1416,328"/>
</svg>
</button>
</div>
<div class="login" role="group" aria-label="Accesso dimostrativo">
<label class="email-field">
<svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m4 7 8 6 8-6"/></svg>
<input type="email" aria-label="E-mail" aria-describedby="email-hint" inputmode="email" autocomplete="off" autocapitalize="none" spellcheck="false">
</label>
<p id="email-hint" class="email-hint" lang="en">try to type</p>
</div>
</div>
</main>
<script src="compete.js" defer></script>
</body>
</html>
